version: 2

sources:
  - name: landing
    description: >-
      Immutable sanitized Parquet registered by dlt. Landing is never edited;
      it is the durable artifact and the database is rebuilt from it.
    schema: landing
    tables:
      - name: card_settlement
        description: One privacy-safe Type 01 movement per source detail record.
      - name: card_settlement_control
        description: >-
          Per-batch controls published by the writer. Carries the source-owned
          declaration unchanged, even when it is wrong.
      - name: instant_payment_event
        description: One privacy-safe Type 02 event per source record.
      - name: instant_payment_event_control
        description: Per-batch Type 02 controls published by the writer.
      - name: ted_transfer_movement
        description: One privacy-safe Type 04 movement per source record.
      - name: ted_transfer_movement_control
        description: Per-batch Type 04 controls published by the writer.
      - name: payment_slip_settlement
        description: One privacy-safe Type 03 settlement per A/B segment pair.
      - name: payment_slip_settlement_control
        description: Per-batch Type 03 controls published by the writer.
      - name: merchant_fee_assessment
        description: One privacy-safe Type 05 fee assessment per source row.
      - name: merchant_fee_assessment_control
        description: >-
          Per-batch Type 05 controls published by the writer. Carries all four
          source-owned declarations (count, gross, assessed, calculated)
          unchanged, even when one is wrong.
