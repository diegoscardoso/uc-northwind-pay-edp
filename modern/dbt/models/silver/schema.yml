version: 2

models:
  - name: silver_card_settlement
    description: "Grain: one conformed movement per source detail record."
    columns:
      - name: batch_id
        tests: [not_null]
      - name: source_record_number
        tests: [not_null]
      - name: amount_brl
        tests: [not_null]
      - name: movement_direction
        tests:
          - not_null
          - accepted_values:
              values: ["PURCHASE", "REFUND"]

  - name: silver_instant_payment_event
    description: "Grain: one conformed Type 02 event per source record."
    columns:
      - name: batch_id
        tests: [not_null]
      - name: source_record_number
        tests: [not_null]
      - name: amount_brl
        tests: [not_null]
      - name: credit_amount
        tests: [not_null]
      - name: debit_amount
        tests: [not_null]

  - name: silver_payment_slip_settlement
    description: "Grain: one conformed Type 03 settlement."
    columns:
      - name: batch_id
        tests: [not_null]
      - name: settlement_id
        tests: [not_null, unique]
      - name: net_amount_brl
        tests: [not_null]
      - name: recomputed_net_amount_brl
        tests: [not_null]

  - name: silver_ted_transfer_movement
    description: "Grain: one conformed Type 04 movement."
    columns:
      - name: batch_id
        tests: [not_null]
      - name: movement_id
        tests: [not_null, unique]
      - name: amount_brl
        tests: [not_null]

  - name: silver_merchant_fee_assessment
    description: "Grain: one conformed Type 05 assessment per source row."
    columns:
      - name: batch_id
        tests: [not_null]
      - name: source_record_number
        tests: [not_null]
      - name: assessed_fee_brl
        tests: [not_null]
      - name: assessment_calculation_delta
        tests: [not_null]
