version: 2

models:
  - name: bronze_card_settlement
    description: "Grain: one privacy-safe Type 01 movement per source detail record."
    columns:
      - name: batch_id
        tests: [not_null]
      - name: source_record_number
        tests: [not_null]
      - name: transaction_id
        tests: [not_null, unique]
      - name: amount_brl
        tests: [not_null]
      - name: card_token
        tests: [not_null]
      - name: movement_code
        tests:
          - not_null
          - accepted_values:
              values: ["P", "R"]

  - name: bronze_card_settlement_control
    description: "Grain: one row per batch, carrying declared and computed controls."
    columns:
      - name: batch_id
        tests: [not_null, unique]
      - name: declared_net_amount
        tests: [not_null]
      - name: computed_net_amount
        tests: [not_null]

  - name: bronze_instant_payment_event
    description: "Grain: one privacy-safe Type 02 event per source record."
    columns:
      - name: batch_id
        tests: [not_null]
      - name: source_record_number
        tests: [not_null]
      - name: end_to_end_id
        tests: [not_null, unique]
      - name: transaction_id
        tests: [not_null, unique]
      - name: amount_brl
        tests: [not_null]
      - name: direction
        tests:
          - not_null
          - accepted_values:
              values: ["C", "D"]
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ["SETTLED", "RETURNED"]

  - name: bronze_instant_payment_control
    description: "Grain: one row per Type 02 batch, declared and computed controls."
    columns:
      - name: batch_id
        tests: [not_null, unique]
      - name: declared_net_amount
        tests: [not_null]
      - name: computed_net_amount
        tests: [not_null]

  - name: bronze_payment_slip_settlement
    description: "Grain: one Type 03 settlement per adjacent A/B segment pair."
    columns:
      - name: batch_id
        tests: [not_null]
      - name: settlement_id
        tests: [not_null, unique]
      - name: net_amount_brl
        tests: [not_null]
      - name: beneficiary_tax_id_type
        tests:
          - not_null
          - accepted_values:
              values: ["CPF", "CNPJ"]

  - name: bronze_payment_slip_control
    description: "Grain: one row per Type 03 batch."
    columns:
      - name: batch_id
        tests: [not_null, unique]
      - name: declared_net_amount
        tests: [not_null]

  - name: bronze_ted_transfer_movement
    description: "Grain: one Type 04 movement per source record."
    columns:
      - name: batch_id
        tests: [not_null]
      - name: movement_id
        tests: [not_null, unique]
      - name: amount_brl
        tests: [not_null]
      - name: movement_kind
        tests:
          - not_null
          - accepted_values:
              values: ["TRANSFER", "RETURN"]
      - name: status_code
        tests:
          - not_null
          - accepted_values:
              values: ["OK", "RT"]

  - name: bronze_ted_transfer_control
    description: "Grain: one row per Type 04 batch."
    columns:
      - name: batch_id
        tests: [not_null, unique]
      - name: declared_net_amount
        tests: [not_null]

  - name: bronze_merchant_fee_assessment
    description: "Grain: one row per (batch_id, source_record_number)."
    columns:
      - name: batch_id
        tests: [not_null]
      - name: source_record_number
        tests: [not_null]
      - name: assessed_fee_brl
        tests: [not_null]
      - name: calculated_fee_brl
        tests: [not_null]
